<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0878bd"><title>Agenda RDV Capital</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230878bd%22%2F%3E%3Cpath%20d%3D%22M15%203h2v3h3v2h-3v3h-2V8h-3V6h3zM7%2019l9-8%209%208v10H7z%22%20fill%3D%22white%22%2F%3E%3Cpath%20d%3D%22M13%2029v-7a3%203%200%200%201%206%200v7z%22%20fill%3D%22%230878bd%22%2F%3E%3Cpath%20d%3D%22M5%2019l11-10%2011%2010%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182b40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#0878bd;color:#fff;text-align:center;padding:25px 15px}h1{margin:0;font-size:1.6rem}header p{margin:5px 0 0;color:#e7f3ff}main{max-width:760px;margin:auto;padding:20px 15px}.toolbar,.card{background:white;padding:12px 14px;border-radius:15px;box-shadow:0 4px 18px #102b4310}.toolbar label{display:block;font-weight:700;margin-bottom:10px}select{width:100%;padding:12px;border:1px solid #c6d0db;border-radius:9px;font:inherit}.hint{font-size:.83rem;color:#607187;margin:11px 0 0}.card{margin-top:9px;background:#fff}.date{font-size:1.12rem;font-weight:750;margin:-12px -14px 8px;padding:10px 14px;background:#eaf7ff;border-radius:15px 15px 0 0}.card.today-card{outline:2px solid #0878bd;outline-offset:1px}.card.today-card .date::after{content:' · HOY';font-size:.76rem;color:#075d91}.entry{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #e9edf2}.entry:last-child{padding-bottom:0}.role{color:#5b6c7e;font-size:.76rem;text-transform:uppercase}.name{font-weight:650;margin-top:2px}.status{font-size:.73rem;font-weight:700;padding:4px 7px;border-radius:18px;white-space:nowrap}.confirmado{background:#d9f3e3;color:#1b673d}.informado{background:#fff0c7;color:#805d0d}.pendiente{background:#ffe1e1;color:#943333}.other{background:#edf1f5;color:#607187}#message{padding:16px;margin-top:17px;border-radius:12px;background:#fff6de;color:#755516}footer{text-align:center;color:#67788a;font-size:.82rem;padding:24px}
.brand{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:center;gap:16px;text-align:center}.brand-copy{min-width:0}.access{padding:36px 15px;min-height:55vh;display:flex;justify-content:center;align-items:flex-start}.access-box{background:#fff;border-radius:16px;padding:26px;max-width:390px;width:100%;box-shadow:0 4px 18px #102b4318}.access-box h2{margin:0 0 8px}.access-box p{color:#607187}.access-box label{display:block;font-weight:700;margin:18px 0 8px}.access-box input{display:block;width:100%;padding:13px;border:1px solid #bac8d5;border-radius:9px;font:inherit}.access-box button{margin-top:16px;width:100%;padding:13px;background:#0878bd;border:0;border-radius:9px;color:white;font:inherit;font-weight:700;cursor:pointer}#access-error{color:#943333}.access[hidden],#protected[hidden]{display:none!important}@media(max-width:400px){header{padding:18px 12px}.brand{gap:12px}h1{font-size:1.25rem}header p{font-size:.78rem}} 
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px;padding:12px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #102b4310}.month-nav button{border:0;background:#353b43;color:#ffffff;padding:12px 10px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.month-nav button:disabled{opacity:.35;cursor:default}.month-nav span{font-size:.8rem;color:#53667a;text-align:center;text-transform:capitalize}@media(max-width:430px){.month-nav button{font-size:.78rem;padding:11px 7px}.month-nav span{font-size:.73rem}}
:root{--header-height:82px;--toolbar-height:124px}header{position:sticky;top:0;z-index:30}.toolbar{position:sticky;top:var(--header-height);z-index:29;border-radius:0 0 15px 15px}.card{scroll-margin-top:calc(var(--header-height) + var(--toolbar-height) + 12px)}
</style></head><body><header><div class="brand"><div class="brand-copy"><h1>Agenda RDV Capital</h1><p>Iglesia Ríos de Vida Capital</p></div></div></header><main><section class="toolbar"><label for="month">Seleccionar mes</label><select id="month"></select><p class="hint">Solo lectura · Mes anterior, actual y siguiente</p></section><div id="message" role="status">Cargando agenda…</div><div id="events" aria-live="polite"></div><nav class="month-nav" aria-label="Navegación entre meses"><button type="button" id="prev-month">← Mes anterior</button><span id="month-label"></span><button type="button" id="next-month">Mes siguiente →</button></nav></main><footer>RDV Capital · Agenda de reuniones</footer>
<script>
'use strict';
const picker=document.getElementById('month'),events=document.getElementById('events'),message=document.getElementById('message');
const today=new Date(),allowed=[];
for(let i=-1;i<=1;i++){const d=new Date(today.getFullYear(),today.getMonth()+i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');allowed.push(key);const option=document.createElement('option');option.value=key;option.textContent=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(d);option.selected=i===0;picker.append(option)}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(days){days=days.filter(d=>Array.isArray(d.asignaciones)&&d.asignaciones.length>0);events.replaceChildren();if(!days.length){message.hidden=false;message.textContent='No hay asignaciones publicadas para este mes.';return}message.hidden=true;for(const day of days){const card=el('article','card');card.dataset.date=day.isoFecha||'';if(day.isoFecha===localDateKey(new Date()))card.classList.add('today-card');card.append(el('div','date',day.fecha));for(const a of day.asignaciones||[]){const row=el('div','entry'),info=el('div');info.append(el('div','role',a.rol),el('div','name',a.nombre||'Sin asignar'));const status=a.estado||'Pendiente',cls=['Confirmado','Informado','Pendiente'].includes(status)?status.toLowerCase():'other';row.append(info,el('span','status '+cls,status));card.append(row)}events.append(card)}}
function localDateKey(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function updateStickyHeights(){document.documentElement.style.setProperty('--header-height',document.querySelector('header').getBoundingClientRect().height+'px');document.documentElement.style.setProperty('--toolbar-height',document.querySelector('.toolbar').getBoundingClientRect().height+'px')}
window.addEventListener('resize',updateStickyHeights);updateStickyHeights();
let firstLoad=true;
function scrollToCurrentDay(){const cards=[...events.querySelectorAll('.card[data-date]')];const current=localDateKey(new Date());const target=cards.find(c=>c.dataset.date===current)||cards.find(c=>c.dataset.date>current)||cards[cards.length-1];if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior:'instant',block:'start'}))}
async function load(){const shouldFocus=firstLoad;firstLoad=false;events.replaceChildren();message.hidden=false;message.textContent='Cargando agenda…';try{const response=await fetch('./data/'+picker.value+'.json',{cache:'no-store'});if(response.status===404){message.textContent='Este mes todavía no fue publicado.';return}if(!response.ok)throw Error('HTTP');const data=await response.json();render((data.dias||[]).map(d=>({...d,isoFecha:d.fecha,fecha:new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(new Date(d.fecha+'T12:00:00'))})));if(shouldFocus){updateStickyHeights();scrollToCurrentDay()}}catch(e){message.textContent='No se pudo cargar la agenda. Intentá nuevamente más tarde.'}}
const prevMonth=document.getElementById('prev-month'),nextMonth=document.getElementById('next-month'),monthLabel=document.getElementById('month-label');
function updateMonthNav(){const i=allowed.indexOf(picker.value);prevMonth.disabled=i<=0;nextMonth.disabled=i<0||i>=allowed.length-1;monthLabel.textContent=picker.selectedOptions[0]?.textContent||''}
function navigateMonth(delta){const i=allowed.indexOf(picker.value)+delta;if(i<0||i>=allowed.length)return;picker.value=allowed[i];updateMonthNav();load();document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'})}
prevMonth.addEventListener('click',()=>navigateMonth(-1));nextMonth.addEventListener('click',()=>navigateMonth(1));
picker.addEventListener('change',()=>{updateMonthNav();load()});updateMonthNav();
load();
</script></body></html>
