<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0878bd"><title>Agenda RDV Capital</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182b40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#0878bd;color:#fff;text-align:center;padding:25px 15px}h1{margin:0;font-size:1.6rem}header p{margin:5px 0 0;color:#e7f3ff}main{max-width:760px;margin:auto;padding:20px 15px}.toolbar,.card{background:white;padding:18px;border-radius:15px;box-shadow:0 4px 18px #102b4310}.toolbar label{display:block;font-weight:700;margin-bottom:10px}select{width:100%;padding:12px;border:1px solid #c6d0db;border-radius:9px;font:inherit}.hint{font-size:.83rem;color:#607187;margin:11px 0 0}.card{margin-top:15px}.date{font-size:1.12rem;font-weight:750;margin-bottom:9px}.entry{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #e9edf2}.entry:last-child{padding-bottom:0}.role{color:#5b6c7e;font-size:.76rem;text-transform:uppercase}.name{font-weight:650;margin-top:4px}.status{font-size:.73rem;font-weight:700;padding:6px 9px;border-radius:18px;white-space:nowrap}.confirmado{background:#d9f3e3;color:#1b673d}.informado{background:#fff0c7;color:#805d0d}.pendiente{background:#ffe1e1;color:#943333}.other{background:#edf1f5;color:#607187}#message{padding:16px;margin-top:17px;border-radius:12px;background:#fff6de;color:#755516}footer{text-align:center;color:#67788a;font-size:.82rem;padding:24px}
</style></head><body><header><h1>Agenda RDV Capital</h1><p>Iglesia Ríos de Vida Capital</p></header><main><section class="toolbar"><label for="month">Seleccionar mes</label><select id="month"></select><p class="hint">Solo lectura · Mes anterior, actual y siguiente</p></section><div id="message" role="status">Cargando agenda…</div><div id="events" aria-live="polite"></div></main><footer>RDV Capital · Agenda de reuniones</footer>
<script>
'use strict';
const SHEET_ID='1R6EQWKFzXlNKZ4KNwNWMCCeY-DYbrw3E0NrLTZogWgk';
const SHEET_BASE='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq';
function getSheet(month){return new Promise((resolve,reject)=>{const callback='rdvCallback'+Date.now()+Math.floor(Math.random()*1000);const script=document.createElement('script');const timeout=setTimeout(()=>finish(new Error('Tiempo de espera agotado')),12000);function finish(error,result){clearTimeout(timeout);script.remove();delete window[callback];error?reject(error):resolve(result)}window[callback]=response=>{if(response.status!=='ok')return finish(new Error('La hoja no es pública'));finish(null,response.table)};const params=new URLSearchParams({sheet:month,tqx:'out:json;responseHandler:'+callback});script.src=SHEET_BASE+'?'+params.toString();script.onerror=()=>finish(new Error('No se pudo acceder a la hoja'));document.head.append(script)})}
function parseTable(table,monthKey){const [year,month]=monthKey.split('-').map(Number),rows=table.rows.map(r=>(r.c||[]).map(c=>c==null?'':String(c.f??c.v??'').trim())),roles=['Dirige','Predica','Santa Cena','Ofrendas','Anuncios'],days=[];for(let r=0;r<rows.length;r++){for(let day=0;day<7;day++){const col=1+day*2;const cell=rows[r]?.[col]||'';if(!/^\\d{1,2}$/.test(cell))continue;const num=Number(cell),date=new Date(year,month-1,num);if(date.getMonth()!==month-1)continue;const assignments=[];for(let offset=1;offset<=5;offset++){const line=rows[r+offset]||[],name=line[col]||'',status=line[col+1]||'';if(!name||/^pendiente$/i.test(name))continue;assignments.push({rol:roles[offset-1],nombre:name,estado:['Confirmado','Informado','Pendiente'].includes(status)?status:'Pendiente'})}if(assignments.length)days.push({fecha:new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(date),sort:date.getTime(),asignaciones:assignments})}}return days.sort((a,b)=>a.sort-b.sort)}
const picker=document.getElementById('month'),events=document.getElementById('events'),message=document.getElementById('message');
const today=new Date(),allowed=[];
for(let i=-1;i<=1;i++){const d=new Date(today.getFullYear(),today.getMonth()+i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');allowed.push(key);const option=document.createElement('option');option.value=key;option.textContent=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(d);option.selected=i===0;picker.append(option)}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(days){events.replaceChildren();if(!days.length){message.hidden=false;message.textContent='No hay asignaciones publicadas para este mes.';return}message.hidden=true;for(const day of days){const card=el('article','card');card.append(el('div','date',day.fecha));for(const a of day.asignaciones||[]){const row=el('div','entry'),info=el('div');info.append(el('div','role',a.rol),el('div','name',a.nombre||'Sin asignar'));const status=a.estado||'Pendiente',cls=['Confirmado','Informado','Pendiente'].includes(status)?status.toLowerCase():'other';row.append(info,el('span','status '+cls,status));card.append(row)}events.append(card)}}
async function load(){events.replaceChildren();message.hidden=false;message.textContent='Cargando agenda…';try{const table=await getSheet(picker.value.replace(/^(\\d{4})-(\\d{2})$/,'$2-$1'));render(parseTable(table,picker.value))}catch(e){message.textContent='No se pudo consultar la agenda. Para habilitar la conexión directa, la hoja mensual debe estar disponible para lectura pública.'}}
picker.addEventListener('change',load);load();
</script></body></html>
